[project]
name = "xknx-models"
version = "0.1.0"
description = "XKNX shared models"
requires-python = ">=3.13"
dependencies = [
    "xsdata>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxmono"]
