[project]
name = "xknx-project"
version = "0.1.0"
description = "XKNX project library"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.0",
    "xknx-models",
    "xknxproject>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxmono"]
