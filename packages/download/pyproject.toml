[project]
name = "xknx-download"
version = "0.1.0"
description = "XKNX device download library"
requires-python = ">=3.13"
dependencies = [
    "xknx-models",
    "xknx-product",
    # Pinned: relies on P2PConnection.request(payload, expected) and the
    # management API as published in the 3.x line.
    "xknx>=3.20,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxmono"]
