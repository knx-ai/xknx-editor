[project]
name = "xknx-recover"
version = "0.1.0"
description = "Reconstruct a KNX project by reading devices back from the bus"
requires-python = ">=3.13"
dependencies = [
    "xknx-models",
    "xknx-product",
    "xknx-catalog",
    "xknx-project",
    "xknx-download",
    "xknx>=3.20,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxmono"]
