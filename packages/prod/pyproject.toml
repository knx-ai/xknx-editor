[project]
name = "xknxeditor-prod"
version = "0.1.0"
description = "XKNX product library"
license = "GPL-2.0-only"
requires-python = ">=3.13"
dependencies = [
    "xknxeditor-namespaces",
    "dukpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxeditor"]
