[project]
name = "xknxeditor-proj"
version = "0.1.0"
description = "XKNX project library"
license = "GPL-2.0-only"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.0",
    "xknxeditor-namespaces",
    "xknxproject>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxeditor"]
