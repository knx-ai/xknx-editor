[project]
name = "xknx-product"
version = "0.1.0"
description = "XKNX product library"
requires-python = ">=3.13"
dependencies = [
    "xknx-models",
    "dukpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxmono"]
