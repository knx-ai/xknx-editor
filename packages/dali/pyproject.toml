[project]
name = "xknxeditor-dali"
version = "0.1.0"
description = "MDT DALI gateway bus commissioning (GC16/Hawk protocol) over KNX"
license = "GPL-2.0-only"
requires-python = ">=3.13"
dependencies = [
    "xknxeditor-namespaces",
    "xknxeditor-download",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxeditor"]
