[project]
name = "xknxeditor-catalog"
version = "0.1.0"
license = "GPL-2.0-only"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "xknxeditor-prod",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxeditor"]

[tool.uv.sources]
xknxeditor-prod = { workspace = true }
