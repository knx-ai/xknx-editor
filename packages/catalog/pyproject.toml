[project]
name = "xknx-catalog"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "xknx-product",
]

[project.scripts]
xknxcatalog = "xknxmono.catalog.http.app:main"
export-openapi = "scripts.export_openapi:main"
ingest-catalog = "scripts.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxmono", "scripts"]

[tool.uv.sources]
xknx-product = { workspace = true }
